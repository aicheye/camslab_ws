# /** matches the node in any namespace (gazebo_multi.launch.py runs one per robot).
# Same trajectory and gains as gtg_sim/types.py Params.
/**/controller_node:
  ros__parameters:
    # Trajectory. (x0, y0, theta0): circle start pose, or Gerono centre and axis.
    shape: circle      # circle or gerono
    x0: 2.0            # [m]
    y0: 1.0            # [m]
    theta0: 0.0        # [rad]
    circle_speed: 0.3  # circle: constant speed [m/s]
    kappa: 1.0         # circle: curvature 1/r [1/m], 0 is a straight line
    a: 2.0             # gerono: half the length of the long axis [m]
    period: 40.0       # gerono: time for one lap [s]
    path_time: 60.0    # reference_path and the limit check cover t in [0, path_time] [s]

    # Control law gains, all > 0.
    k_par: 1.0         # [1/s]
    k_perp: 4.0        # [1/m^2]
    k_q: 2.0           # [1/s]

    # Limits. The reference must keep |kappa*| <= kappa_max and |w*| <= w_max, and every
    # command is clamped to |v| <= v_max, |w| <= min(w_max, kappa_max |v|).
    kappa_max: 2.9     # tan(0.6) / 0.235, the R2's steering limit [1/m]
    w_max: 2.0         # [rad/s]
    v_max: 0.6         # [m/s]

    pose_timeout: 0.5  # zero command when the last pose is older than this [s]
    rate: 50.0         # [Hz]
