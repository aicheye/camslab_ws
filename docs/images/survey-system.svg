<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1050 480" font-family="Helvetica, Arial, sans-serif" font-size="14">
  <title>The fiducial survey: what runs on the car and on this computer, and the topics between them</title>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2f3b4a"/>
    </marker>
  </defs>
  <rect width="1050" height="480" fill="#ffffff"/>

  <!-- the two computers -->
  <g fill="#f3f5f8" stroke="#8a96a3" stroke-width="1.2">
    <rect x="20" y="40" width="270" height="420" rx="8"/>
    <rect x="430" y="40" width="450" height="420" rx="8"/>
  </g>
  <g font-weight="bold" fill="#2f3b4a">
    <text x="36" y="64">Car</text>
    <text x="446" y="64">This computer</text>
  </g>
  <line x1="360" y1="48" x2="360" y2="452" stroke="#8a96a3" stroke-width="1.2" stroke-dasharray="6 5"/>
  <text x="360" y="34" text-anchor="middle" fill="#5b6876">lab WiFi</text>

  <!-- nodes -->
  <g fill="#ffffff" stroke="#2f3b4a" stroke-width="1.4">
    <rect x="80" y="76" width="150" height="34" rx="5"/>
    <rect x="50" y="140" width="210" height="56" rx="5"/>
    <rect x="50" y="260" width="210" height="56" rx="5"/>
    <rect x="50" y="380" width="210" height="56" rx="5"/>
    <rect x="460" y="140" width="170" height="56" rx="5"/>
    <rect x="460" y="260" width="170" height="56" rx="5"/>
    <rect x="460" y="380" width="170" height="56" rx="5"/>
    <rect x="690" y="140" width="170" height="56" rx="5"/>
    <rect x="690" y="380" width="170" height="56" rx="5"/>
    <rect x="910" y="260" width="120" height="56" rx="5" stroke-dasharray="5 4"/>
  </g>
  <g text-anchor="middle" fill="#1d2630">
    <text x="155" y="98">USB camera</text>
    <text x="155" y="164" font-weight="bold">Camera node</text>
    <text x="155" y="183" font-size="12" fill="#5b6876">car_node.py: marker poses</text>
    <text x="155" y="284" font-weight="bold">Car's driver</text>
    <text x="155" y="303" font-size="12" fill="#5b6876">motors and steering</text>
    <text x="155" y="404" font-weight="bold">Command relay</text>
    <text x="155" y="423" font-size="12" fill="#5b6876">car_drive.py: zero after 0.5 s</text>
    <text x="545" y="164" font-weight="bold">Estimator</text>
    <text x="545" y="183" font-size="12" fill="#5b6876">camera mount, marker poses</text>
    <text x="545" y="284" font-weight="bold">vrpn_mocap</text>
    <text x="545" y="303" font-size="12" fill="#5b6876">motion capture client</text>
    <text x="545" y="404" font-weight="bold">Controller</text>
    <text x="545" y="423" font-size="12" fill="#5b6876">path, safe area, limits</text>
    <text x="775" y="164" font-weight="bold">RViz and web UI</text>
    <text x="775" y="183" font-size="12" fill="#5b6876">estimate, radii, preview</text>
    <text x="775" y="404" font-weight="bold">Web UI</text>
    <text x="775" y="423" font-size="12" fill="#5b6876">Start, Stop, path, safe area</text>
    <text x="970" y="284" font-weight="bold">Motion</text>
    <text x="970" y="303" font-weight="bold">capture</text>
  </g>

  <!-- connections -->
  <g fill="none" stroke="#2f3b4a" stroke-width="1.5" marker-end="url(#arrow)">
    <line x1="155" y1="110" x2="155" y2="139"/>
    <line x1="260" y1="160" x2="459" y2="160"/>
    <polyline points="245,140 245,120 775,120 775,139"/>
    <line x1="630" y1="168" x2="689" y2="168"/>
    <line x1="545" y1="260" x2="545" y2="197"/>
    <line x1="545" y1="316" x2="545" y2="379"/>
    <line x1="910" y1="288" x2="631" y2="288"/>
    <line x1="690" y1="408" x2="631" y2="408"/>
    <line x1="460" y1="408" x2="261" y2="408"/>
    <line x1="155" y1="380" x2="155" y2="317"/>
  </g>
  <g font-size="12.5" fill="#1d2630">
    <text x="310" y="153" text-anchor="middle">observations</text>
    <text x="510" y="113" text-anchor="middle">preview</text>
    <text x="660" y="160" text-anchor="middle" font-size="11.5">estimate</text>
    <text x="553" y="233">pose</text>
    <text x="553" y="352">pose</text>
    <text x="310" y="401" text-anchor="middle">cmd_vel</text>
    <text x="163" y="352">driver_cmd_vel</text>
  </g>
</svg>
