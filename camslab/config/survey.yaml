# Settings of survey.launch.py: fiducial surveying on a real car with a USB camera and the
# lab motion capture (docs/hardware-survey.md). This file holds what changes between cars
# and sessions. What is the same for every car of the lab (the camera format, the printed
# markers, the detection limits, the ports) is in camslab.car.DEFAULTS; one of those keys
# set here replaces the value there. Pass another file with config:=/path/to/file.yaml;
# a launch argument with the same name overrides a top-level value: name:=bodies.

# The car: its ROS namespace and rigid body name in the motion capture, its ssh address
# and its camera calibration in config/cameras/.
name: angostura
camera_host: jetson@192.168.1.85
camera: angostura_640x480

mocap_server: 129.97.71.49       # the lab's VRPN server
camera_delay: 0.05               # image latency [s]; the batch check of a recorded run prints this camera's

# Driving. The path controller runs on this computer, disabled until Start is pressed in
# the web UI. Its commands reach the car's driver through the command relay on the car,
# which sends zero once no command arrived for 0.5 s. driver_cmd_vel is the Twist topic
# the car's driver listens on (`ros2 topic list` on the car while the driver runs). With
# drive false nothing here commands the car.
drive: true
driver_cmd_vel: /cmd_vel

# The path, on top of params.yaml: a bowtie, fitted into the safe area. Whenever the safe
# area is set in the web UI, and at every launch with a saved one, the centre, the
# direction and the size of the bowtie are set to the largest one that fits, at most 4 m
# by 2 m, driven at 0.14 m/s (0.42 rad/s in the corners). Nothing about the path is set
# here but the car's limits. The car starts at the centre of the area, along a diagonal.
controller:
  shape: bowtie
  period: 80.0                   # [s], until a safe area is set
  kappa_max: 2.9                 # the R2's steering limit [1/m]; the corners are arcs of this curvature
  v_max: 0.4                     # [m/s], also the relay's limit on the car
  w_max: 2.0                     # [rad/s], also the relay's limit on the car

# The markers in the room, ids of hardware/marker_mounts/markers.pdf, the height of each
# marker's centre above the motion capture's z = 0 plane [m], and which heights the
# estimator may use (at least one). The heights are the nominal ones of the stands;
# measure them once the stands are placed. A stand goes about half a metre past a
# corner of the bowtie, facing the car that drives toward the corner. With two stands:
# one past the end of a short side, the other past the end of a diagonal.
marker_ids: [0, 2]               # the upright and the diamond stand
marker_height: [0.10, 0.14]
marker_height_known: [true, true]
