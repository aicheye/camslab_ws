[project]
name = "camslab-standalone"
version = "0.1.0"
description = "Standalone Python experiments, no ROS: trajectory tracking, mass-spring-damper estimation, circular path identification."
requires-python = ">=3.10"
dependencies = [
    "numpy",
    "scipy",
    "matplotlib",
    "camslab",
    "camslab-webui",
    "rosbags>=0.11.9",
]

[dependency-groups]
dev = [
    "opencv-python-headless>=5.0.0.93",
    "pytest",
]

[tool.uv.sources]
camslab = { path = "../camslab", editable = true }
camslab-webui = { path = "../camslab_webui", editable = true }

[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["camslab_standalone*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--import-mode=importlib"
