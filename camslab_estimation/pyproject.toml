[project]
name = "camslab-estimation"
version = "0.1.0"
description = "Online estimation of mass, damping and stiffness of a mass-spring-damper."
requires-python = ">=3.10"
dependencies = [
    "numpy",
    "scipy",
    "matplotlib",
]

[dependency-groups]
dev = ["pytest"]

[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["camslab_estimation"]

[tool.pytest.ini_options]
testpaths = ["tests"]
